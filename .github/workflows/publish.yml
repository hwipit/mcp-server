name: Release

# Manual only: nothing publishes from this fork on push. The job also refuses to
# run outside the hwipit org or under a non-@hwip package name.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository_owner == 'hwipit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse non-Hwip package name
        run: |
          name=$(node -p "require('./package.json').name")
          case "$name" in
            @hwip/*) echo "publishing $name" ;;
            *) echo "::error::package name is '$name', expected @hwip/*"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
